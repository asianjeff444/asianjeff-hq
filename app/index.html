<title>AsianJeff HQ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* ===== The look: dark, big type, rounded tiles ===== */
:root{
  --bg:#0C0C10;--surface:#17171D;--surface2:#1F1F27;--ink:#F5F5F8;--soft:#D0D0D9;--muted:#8E8E9B;--line:#272730;--fill:#202028;
  --accent:#FF4D8F;--ok:#1BE07F;--danger:#FF5A6E;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 2px 4px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;padding:0;   /* the page handles the notch itself (body padding), inside Claude too */
}
/* the app is always dark: same colors whatever the phone's setting */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0C10;--surface:#17171D;--ink:#F5F5F8}}
:root[data-theme="dark"]{--bg:#0C0C10;--surface:#17171D;--ink:#F5F5F8}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.35;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;position:relative}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:22px;min-height:76px}
.brand{min-width:0}
.brand small{display:block;font-weight:600;font-size:15px;color:var(--muted);margin-bottom:2px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:.1em;box-shadow:0 0 14px var(--accent)}
.rbtn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;transition:transform .15s}
.rbtn:active{transform:scale(.92)}
.backbtn{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:16px}

/* paste / type box */
.capture{margin-top:18px;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:7px 7px 7px 18px;box-shadow:var(--shadow)}
.capture:focus-within{border-color:var(--soft)}
.capture input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:12px 0;font-size:18px}
.capture input::placeholder{color:var(--muted)}
.go{border-radius:14px;background:var(--gc,var(--accent));color:#fff;font-weight:800;font-size:17px;padding:13px 20px;flex:none}
.go:disabled{opacity:.45}
.saveto{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;align-items:center;padding-bottom:2px}
.saveto::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;color:var(--soft);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}

/* cards */
.card{margin-top:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.count{min-width:26px;height:26px;border-radius:13px;padding:0 8px;background:var(--fill);color:var(--soft);font-weight:800;font-size:14px;display:inline-grid;place-items:center;margin-left:8px;vertical-align:.18em}
.link{font-weight:700;font-size:15px;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.pl{border-radius:999px;padding:8px 14px;background:var(--fill);font-weight:700;font-size:15px;color:var(--soft)}
.pl.on{background:var(--ink);color:var(--bg)}

/* Insights tile (home) */
.itile{position:relative;display:block;width:100%;text-align:left;margin-top:16px;border-radius:26px;padding:18px;overflow:hidden;isolation:isolate;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,#FF4D8F,#FF9140 45%,#9B6BFF) border-box;border:2px solid transparent;box-shadow:var(--shadow)}
.itile:active{transform:scale(.985)}
.it-top{display:flex;align-items:center;gap:12px}
.it-av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FF4D8F,#FF9140);background-size:cover;background-position:center}
.it-av svg{width:24px;height:24px}
.it-nm{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.05}
.it-sub{font-size:15px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-chev{margin-left:auto;color:var(--muted)}
.it-row{display:flex;align-items:flex-end;gap:16px;margin-top:14px}
.it-nums{display:flex;gap:22px;flex:none}
.it-nums b{display:block;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1}
.it-nums span{font-size:14px;color:var(--muted);font-weight:600}
.it-spark{flex:1;min-width:60px;height:52px;display:block}
.it-spark path.l{fill:none;stroke:#FF4D8F;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.it-spark path.a{fill:url(#sparkFill);stroke:none}

/* to-dos */
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 13px;outline:0;font-size:16px}
.addrow input:focus{border-color:var(--soft)}
.addrow .go{padding:0 16px;display:grid;place-items:center}
.tick{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--c,var(--muted));display:grid;place-items:center;flex:none;transition:background .2s,transform .2s}
.tick svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:.2s}
.tick.on{background:var(--c,var(--ok));border-color:var(--c,var(--ok))}
.tick.on svg{opacity:1;transform:none}
.tick:active{transform:scale(.88)}
.empty{color:var(--muted);font-size:15.5px;padding:10px 0 4px}
.more{margin-top:8px;font-weight:700;font-size:15px;color:var(--muted)}

/* tiles */
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{position:relative;border-radius:26px;padding:18px 16px 16px;min-height:150px;text-align:left;color:#fff;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;
  background:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.6px) 0 0/18px 18px,linear-gradient(150deg,var(--c) 0%,var(--cd) 100%);
  box-shadow:0 10px 26px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .18s var(--ease)}
.tile:active{transform:scale(.96)}
.tile .em{font-size:42px;line-height:1;margin-bottom:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.tile .nm{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1.02;margin-top:14px;text-shadow:0 2px 10px rgba(0,0,0,.28);overflow-wrap:anywhere}
.tile .ct{font-weight:600;font-size:15px;opacity:.92;margin-top:4px}
.tile .ed{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center}
.tile .ed svg{width:18px;height:18px}
.editing .tile{animation:wig .5s ease-in-out infinite alternate}
.editing .tile:nth-child(2n){animation-delay:-.25s}
@keyframes wig{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.tile.add{background:transparent;border:2.5px dashed var(--line);color:var(--muted);box-shadow:none;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:17px;animation:none}
.tile.add svg{width:30px;height:30px}

/* a tile's page */
.hero{margin-top:14px;border-radius:28px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(rgba(255,255,255,.12) 1.2px,transparent 1.6px) 0 0/18px 18px,linear-gradient(150deg,var(--c),var(--cd));box-shadow:0 14px 34px color-mix(in srgb,var(--c) 28%,transparent)}
.hero .em{font-size:52px;line-height:1}
.hero h2{margin:12px 0 0;font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.03em;line-height:1}
.hero p{margin:6px 0 0;font-weight:600;opacity:.9}
.hero .ed{position:absolute;top:16px;right:16px;border-radius:999px;background:rgba(0,0,0,.25);padding:8px 14px;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.hero .ed svg{width:17px;height:17px}
.ideas{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.idea{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px;border-radius:20px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 24%,var(--line))}
.idea .tx{text-align:left;min-width:0}
.idea .tx b{display:block;font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.idea .tx span{display:block;color:var(--muted);font-size:15px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.idea .tx em{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:13.5px;font-weight:700;color:var(--soft);margin-top:7px}
.idea .tx em svg{width:14px;height:14px}
.idea.done{opacity:.6}
.idea.done .tx b{text-decoration:line-through}
.idea.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--c)}30%{box-shadow:0 0 0 4px var(--c)}100%{box-shadow:0 0 0 0 transparent}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(6,6,10,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;animation:fadeIn .25s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:sheetUp .45s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.out{animation:sheetDown .24s cubic-bezier(.4,0,1,1) forwards}
.scrim.out{animation:fadeOut .24s ease forwards}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-h h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.x{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.fl{display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:15px;color:var(--soft)}
.fin{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:13px 14px;outline:0;font-size:17px;font-weight:500;color:var(--ink)}
.fin:focus{border-color:var(--soft)}
textarea.fin{min-height:110px;resize:vertical;line-height:1.4}
.fin.lg{font-size:22px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{flex:1 1 140px;border-radius:18px;padding:16px;font-weight:800;font-size:17px;background:var(--c,var(--ink));color:#fff;text-align:center}
.big.quiet{background:var(--fill);color:var(--ink)}
.big.danger{background:transparent;border:2px solid var(--line);color:var(--danger)}
.big.danger.sure{background:var(--danger);border-color:var(--danger);color:#fff}
.stamp{font-size:14px;color:var(--muted);text-align:center}
.links{display:flex;flex-direction:column;gap:8px}
.lk{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px}
.lk a{flex:1;min-width:0;color:var(--soft);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.lk button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.lk button svg{width:16px;height:16px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;background:var(--bg);font-size:24px;display:grid;place-items:center;border:2px solid transparent}
.emojis button[aria-pressed="true"]{border-color:var(--ink)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.swatches button{aspect-ratio:1;border-radius:50%;background:linear-gradient(150deg,var(--c),var(--cd));border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.preview{display:flex;justify-content:center}
.preview .tile{width:170px;min-height:140px;pointer-events:none;animation:none}
.status{display:flex;gap:12px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.status i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.status i.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status i.bad{background:var(--danger)}
.status div{font-size:15px;color:var(--soft);font-weight:600}
.status small{display:block;color:var(--muted);font-weight:500;margin-top:2px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);
  border-radius:999px;padding:12px 14px 12px 20px;font-weight:700;font-size:15.5px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);
  width:max-content;max-width:calc(100vw - 32px);animation:toastIn .35s var(--ease)}
.toast button{background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14.5px}
.toast.out{animation:fadeOut .2s ease forwards}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}}

/* page moves */
#view.enter{animation:pgIn .38s var(--ease)}
#view.back{animation:pgBack .38s var(--ease)}
@keyframes pgIn{from{transform:translateX(34px);opacity:0}}
@keyframes pgBack{from{transform:translateX(-34px);opacity:0}}
.ins-page.open{animation:insIn .34s var(--ease)}
@keyframes insIn{from{transform:translateX(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.skel{height:22px;border-radius:8px;background:var(--fill);margin:10px 0}

/* page titles (Life, Sponsors) */
.pgt{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
/* home: to-dos card (the full deck + calendar live on the Life page) */
.hm-td .addtodo{margin-top:12px}
.hm-hint{font-size:14px;margin-top:8px}
.hm-list{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.hm-td .more{display:block;margin-top:10px}
/* Sponsors */
.sptile{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,#FFC83D,#FF9140) border-box}
.it-av.sp{background:linear-gradient(135deg,#FFC83D,#FF9140);color:#2A1A00}
.sp-n{min-width:30px;height:30px;border-radius:15px;padding:0 9px;background:#FFC83D;color:#2A1A00;font-weight:800;font-size:15px;display:grid;place-items:center;margin-left:auto;flex:none}
.sp-n+.it-chev{margin-left:6px}
.sp-sec{margin-top:18px}
.spl{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.spc{display:block;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line)}
.spc:active{transform:scale(.985)}
.spc.r-caution{border-color:rgba(255,145,64,.6)}
.spc.r-danger{border-color:rgba(255,90,110,.75);background:color-mix(in srgb,#FF5A6E 9%,var(--surface))}
.spc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.spc-h b{font-size:19px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spc-o{flex:none;border-radius:999px;padding:5px 12px;background:rgba(255,200,61,.16);color:#FFC83D;font-weight:800;font-size:15px}
.spc-g{color:var(--soft);font-size:15.5px;margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.spc-m{color:var(--muted);font-size:14px;font-weight:600;margin-top:8px}
.spc-r{color:#FF8FA0;font-weight:800;margin-right:6px}
.spc-new{font-style:normal;color:#FFC83D;font-weight:800}
.sp-empty{text-align:center;padding:30px 22px}
.sp-empty h3{margin:12px 0 6px;font-family:var(--display);font-weight:800;font-size:24px}
.sp-empty p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.sp-big{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:linear-gradient(135deg,#FFC83D,#FF9140);color:#2A1A00}
.sp-big svg{width:30px;height:30px}
.sp-ttl{margin:0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05}

function days(){return (D.acc&&D.acc.days)||[];}
function range(id){const n=days().length;if(!n)return null;const L=n-1;
  if(id==="custom"&&st.custom){let a=days().findIndex(x=>x.d>=st.custom.s),b=0;for(let i=0;i<n;i++)if(days()[i].d<=st.custom.e)b=i;if(a<0)a=0;if(b<a)b=a;const len=b-a+1;return{a,b,pa:a-len,pb:a-1,len,id};}

function sum(k,a,b){let s=0;const dd=days();for(let i=Math.max(0,a);i<=b&&i<dd.length;i++)s+=dd[i][k]||0;return s;}
function series(k,r){return days().slice(r.a,r.b+1).map(x=>x[k]||0);}

  const fo=P_.follows??sum("fo",r.a,r.b),un=P_.unfollows??sum("un",r.a,r.b);return{fo,un,net:P_.net??(fo-un)};}

const PL=(()=>{
const CAP=5,DAYS=14;
const QUICK=/^(call|text|email|e-mail|message|dm|pay|cancel|schedule|book|order|ask|reply|check|renew|sign|submit|send|venmo|zelle|confirm|remind|tell|follow)\b/,
  ERR=/\b(return|ship|drop off|drop-off|pick up|pickup|go to|buy|grocer|groceries|store|post office|ups|fedex|usps|dmv|bank|walmart|target|best buy|costco|amazon|mail|errand)\b/,
  BIG=/\b(move|moving|pack|clean|fix|build|set up|setup|organize|meal prep|taxes|apply|install|repair|deep)\b/,
  TALK=/^(call|text|email|e-mail|message|dm|phone|ask|reply|follow up|tell|remind)\b/;
const low=x=>(x.t+" "+(x.d||"")).toLowerCase();
function size(x){const t=x.t.toLowerCase(),a=low(x);if(BIG.test(a)&&!QUICK.test(t))return 3;if(ERR.test(a)&&!TALK.test(t))return 2;if(QUICK.test(t))return 1;return 1.5;}
function batch(x){const g=LF.gOf(x),t=x.t.toLowerCase();if(TALK.test(t))return"talk";if(g==="returns"||g==="shopping"||(ERR.test(low(x))&&size(x)===2))return"errand";return"g:"+g;}
const disc=b=>b==="talk"||b==="errand"?.3:.8;
function plan(){const t=UC.today(),h=new Date().getHours(),days=Array.from({length:DAYS},(_,j)=>UC.kAdd(t,j));
  const cap={},load={},has={};days.forEach(k=>{cap[k]=CAP;load[k]=0;has[k]=new Set();});
  const open=S.todos.filter(x=>!x.done&&!x.deletedAt),todo=[];
  open.forEach(x=>{const mine=x.on&&x.onBy!=="plan",stale=x.onBy==="plan"&&(!x.on||x.on<t);
    if(x.onBy==="none"||(!x.on&&x.onBy&&x.onBy!=="plan"))return;
    if(mine||(x.onBy==="plan"&&!stale)){const k=x.on<t?t:x.on;if(load[k]!=null){const b=batch(x);load[k]+=has[k].has(b)?size(x)*disc(b):size(x);has[k].add(b);}return;}
    todo.push(x);});
  if(!todo.length)return[];
  const by={};todo.forEach(x=>{const b=batch(x);(by[b]||(by[b]=[])).push(x);});
  const B=Object.entries(by).map(([b,L])=>{L.sort((p,q)=>(q.urgent?1:0)-(p.urgent?1:0)||(p.createdAt||0)-(q.createdAt||0));return{b,L,u:L.some(x=>x.urgent),age:Math.min(...L.map(x=>x.createdAt||0))};})
    .sort((p,q)=>(q.u?1:0)-(p.u?1:0)||p.age-q.age);
  const start=h>=17?1:0,out=[];
  B.forEach(({b,L})=>L.forEach(x=>{let pick=null;
    if(x.urgent)pick=t;
    else{for(let j=start;j<DAYS&&!pick;j++){const k=days[j];if(has[k].has(b)&&load[k]+size(x)*disc(b)<=cap[k]+1+1e-9)pick=k;}
      for(let j=start;j<DAYS&&!pick;j++){const k=days[j],c=has[k].has(b)?size(x)*disc(b):size(x);if(load[k]+c<=cap[k]+1e-9)pick=k;}
      if(!pick)pick=days.slice(start).reduce((m,k)=>load[k]-cap[k]<load[m]-cap[m]?k:m,days[start]);}
    load[pick]+=has[pick].has(b)?size(x)*disc(b):size(x);has[pick].add(b);out.push({id:x.id,on:pick});}));
  return out;}
let sig="",tm=0,busy=false;
function want(){return!!(S.db&&S.loaded&&S.metaReady&&S.metaReady.todoGroups&&Array.isArray(S.todos));}
function need(){const t=UC.today();return S.todos.filter(x=>!x.done&&!x.deletedAt&&x.onBy!=="none"&&(!x.on?!x.onBy||x.onBy==="plan":x.onBy==="plan"&&x.on<t)).map(x=>x.id).sort().join(",");}
function kick(){if(!want()||busy)return;const n=need(),s=UC.today()+"|"+n;if(!n||s===sig)return;clearTimeout(tm);tm=setTimeout(run,1200);}

  try{const P=plan(),now=Date.now();if(!P.length)return;const map=Object.fromEntries(P.map(p=>[p.id,p.on]));
    S.todos=S.todos.map(x=>map[x.id]?{...x,on:map[x.id],onAt:now,onBy:"plan"}:x);render();
    await Promise.all(P.map(p=>S.db.collection("todos").doc(p.id).update({on:p.on,onAt:now,onBy:"plan"}).catch(()=>{})));
    const ds=new Set(P.map(p=>p.on)).size;toast(`Planned ${P.length} to-do${P.length>1?"s":""} across ${ds} day${ds>1?"s":""}`);}
  finally{busy=false;}}
return{plan,kick,run,size,batch};
})();

/* ---------- the database: Claude's, the app's (Supabase), or this browser's ---------- */
function localDB(){
  const KEY="starter-app-data";let M={};try{M=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(M));}catch(e){}};
  const subs=new Set();const fire=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const par=p=>p.split("/").slice(0,-1).join("/");
  const snap=p=>({id:p.split("/").pop(),exists:p in M,data:()=>M[p]===undefined?undefined:clone(M[p])});
  const doc=p=>({id:p.split("/").pop(),path:p,get:async()=>snap(p),
    set:async d=>{M[p]=clone(d);save();fire();},update:async d=>{if(!(p in M))throw{code:"invalid_argument"};M[p]={...M[p],...clone(d)};save();fire();},
    delete:async()=>{delete M[p];save();fire();},onSnapshot(cb){const f=()=>cb(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}});
  const col=c=>({doc:id=>doc(c+"/"+(id||newId())),get:async()=>{const docs=Object.keys(M).filter(k=>par(k)===c).sort().map(snap);return{docs,size:docs.length,empty:!docs.length};},
    onSnapshot(cb){const f=()=>{const docs=Object.keys(M).filter(k=>par(k)===c).sort().map(snap);cb({docs,size:docs.length,empty:!docs.length});};subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}});
  addEventListener("storage",e=>{if(e.key===KEY){try{M=JSON.parse(e.newValue||"{}");}catch(_){}fire();}});
  return{doc,collection:col};
}
async function openDB(){
  try{if(window.claude&&typeof window.claude.use==="function"){const d=await window.claude.use("db");if(d)return{db:d,mode:window.__APP_RUNTIME?"app":"claude"};}}catch(e){}
  return{db:localDB(),mode:"local"};
}

    <input class="fin lg" id="idTitle" value="${esc(i.title)}" placeholder="Idea" aria-label="Title">
    <label class="fl">Details<textarea class="fin" id="idDetails" placeholder="Notes, steps, anything">${esc(i.details||"")}</textarea></label>
    <div class="fl">Links<div class="links">${(i.links||[]).map((u,k)=>`<div class="lk"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,""))}</a><button type="button" data-linkdel="${k}" aria-label="Remove link">${ICON.x}</button></div>`).join("")}
      <form class="addrow" id="linkForm" style="margin:0" autocomplete="off"><input id="linkIn" placeholder="Paste a link" inputmode="url" aria-label="New link"><button class="go" type="submit" style="--gc:${colOf(c)[0]}" aria-label="Add link">${ICON.plus}</button></form></div></div>
    <div class="fl">Tile<div class="saveto" style="margin:0;flex-wrap:wrap">${cats().map(x=>`<button class="chip" type="button" data-movecat="${esc(x.id)}" aria-pressed="${x.id===i.cat}" style="--c:${colOf(x)[0]}">${esc(x.emoji)} ${esc(x.name)}</button>`).join("")}</div></div>
    <div class="row"><button class="big" type="button" data-act="ideaToggle" style="--c:${i.done?"#2B2B36":colOf(c)[0]}">${i.done?"Not done yet":"✓ Mark done"}</button><button class="big danger${s.sure?" sure":""}" type="button" data-act="ideaDel">${s.sure?"Tap again to delete":"Delete"}</button></div>
    <div class="stamp">Added ${new Date(i.createdAt||Date.now()).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}${i.done&&i.doneAt?` · done ${new Date(i.doneAt).toLocaleDateString("en-US",{month:"short",day:"numeric"})}`:""}</div>`;}
  else if(s.kind==="life"){h=LF.sheet(s.id);if(!h)return;}
  else if(s.kind==="sponsor"){const x=S.sponsors.find(y=>y.id===s.id);if(!x){closeSheet();return;}h=spSheet(x);}
  else if(s.kind==="tile"){const c=s.draft;const n=S.ideas.filter(i=>i.cat===c.id).length,others=cats().filter(x=>x.id!==c.id);
    h=`<div class="sh-h"><h3>${s.isNew?"New tile":"Edit tile"}</h3><button class="x" type="button" data-act="close" aria-label="Close">${ICON.x}</button></div>
    <div class="preview"><div class="tile" style="${tint(c)}"><span class="em">${esc(c.emoji)}</span><span class="nm">${esc(c.name||"Name")}</span><span class="ct">${n} idea${n===1?"":"s"}</span></div></div>
    <label class="fl">Name<input class="fin" id="tlName" value="${esc(c.name)}" maxlength="28" placeholder="Name this tile"></label>
    <div class="fl">Emoji<div class="addrow" style="margin:0"><input class="fin" id="tlEmoji" value="${esc(c.emoji)}" maxlength="8" aria-label="Type any emoji" style="font-size:24px;text-align:center;max-width:90px"><span class="empty" style="padding:0;align-self:center">Type any emoji, or pick one</span></div>
      <div class="emojis">${EMOJIS.map(e=>`<button type="button" data-emoji="${e}" aria-pressed="${e===c.emoji}">${e}</button>`).join("")}</div></div>
    <div class="fl">Color<div class="swatches">${Object.entries(COLORS).map(([k,v])=>`<button type="button" data-color="${k}" aria-pressed="${k===c.color}" aria-label="${k}" style="--c:${v[0]};--cd:${v[1]}"></button>`).join("")}</div></div>
    ${s.isNew?"":`<div class="row"><button class="big quiet" type="button" data-move="-1">← Move left</button><button class="big quiet" type="button" data-move="1">Move right →</button></div>`}
    <div class="row"><button class="big" type="button" data-act="tileSave" style="--c:${colOf(c)[0]}">${s.isNew?"Add tile":"Save"}</button>${s.isNew||!others.length?"":`<button class="big danger${s.sure?" sure":""}" type="button" data-act="tileDel">${s.sure?(n?`Delete (its ${n} idea${n>1?"s":""} move to ${esc(others[0].name)})`:"Tap again to delete"):"Delete tile"}</button>`}</div>`;}
  else if(s.kind==="settings"){const d=S.sync||{},at=Math.max(+d.at||0,+d.quickAt||0),ct=(IG.D.postsDoc&&IG.D.postsDoc.counts)||{};
    const st=d.lastErr&&(+d.lastErrAt||0)>at?["bad","Instagram refresh has a problem",d.lastErr]:at?["ok",`Connected${ct.user?" as @"+ct.user:""}`,`Updated ${ago(at)}`]:["",S.mode==="app"?"Not connected yet":"Instagram connects in the home-screen app","Ask Claude to help you connect it"];
    h=`<div class="sh-h"><h3>Settings</h3><button class="x" type="button" data-act="close" aria-label="Close">${ICON.x}</button></div>
    <label class="fl">App name<input class="fin" id="appName" value="${esc(appName())}" maxlength="24"></label>
    <div class="fl">Instagram<div class="status"><i class="${st[0]}"></i><div>${esc(st[1])}<small>${esc(st[2])}</small></div></div></div>
    ${S.mode==="app"?`<button class="big quiet" type="button" data-act="signout">Sign out</button>`:""}
    <div class="stamp">${S.mode==="app"?`Version ${esc(window.__APP_VER||"")}`:S.mode==="claude"?"Preview inside Claude (its own test data)":"Saved in this browser only"}</div>`;}
  const fresh=!r.querySelector(".sheet");
  r.innerHTML=`<div class="scrim" data-act="close"${fresh?"":` style="animation:none"`}></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"${fresh?"":` style="animation:none"`}><div class="sheet-in">${s.kind==="life"?"":`<div class="grab"></div>`}${h}</div></div>`;
}
// sheets redraw when data changes, but never while you're typing in them
function sheetSync(){const s=S.sheet;if(!s||s.kind==="tile"||s.kind==="life")return;const ae=document.activeElement;if(ae&&$("#sheetRoot").contains(ae)&&/INPUT|TEXTAREA/.test(ae.tagName))return;drawSheet();}

/* ---------- actions ---------- */
async function addIdea(text,catId){
  text=String(text||"").trim();if(!text)return;
  const url=(text.match(/https?:\/\/\S+/)||[])[0],now=Date.now(),id=newId();
  let title=text;if(url){const rest=text.replace(url,"").trim();title=rest||url.replace(/^https?:\/\/(www\.)?/,"").split(/[/?#]/)[0];}
  const doc={title,details:"",links:url?[url]:[],cat:catId,done:false,doneAt:null,createdAt:now,updatedAt:now};
  S.ideas.push({id,...doc});render();
  await save("ideas/"+id,doc);return id;
}
const ideaDoc=i=>{const {id,...d}=i;return d;};
async function patchIdea(id,p){const i=S.ideas.find(x=>x.id===id);if(!i)return;Object.assign(i,p,{updatedAt:Date.now()});render();sheetSync();await save("ideas/"+id,ideaDoc(i));}
async function toggleIdea(id){const i=S.ideas.find(x=>x.id===id);if(!i)return;const d=!i.done;await patchIdea(id,{done:d,doneAt:d?Date.now():null});if(d)toast("Done!",()=>patchIdea(id,{done:false,doneAt:null}));}
async function delIdea(id){const i=S.ideas.find(x=>x.id===id);if(!i)return;const keep=clone(i);S.ideas=S.ideas.filter(x=>x.id!==id);closeSheet();render();await remove("ideas/"+id);
  toast("Idea deleted",async()=>{S.ideas.push(keep);render();await save("ideas/"+id,ideaDoc(keep));});}
const todoDoc=t=>{const {id,...d}=t;return d;};
async function patchTodo(id,p){const t=S.todos.find(x=>x.id===id);if(!t)return;Object.assign(t,p);render();LF.sheetSync();await save("todos/"+id,todoDoc(t));}
async function tickTodo(id){const x=S.todos.find(y=>y.id===id);if(!x)return;const d=!x.done;await patchTodo(id,{done:d,doneAt:d?Date.now():null});if(d)toast("Done ✓",()=>patchTodo(id,{done:false,doneAt:null}));}
async function delTodo(id){const t=S.todos.find(x=>x.id===id);if(!t)return;const keep=clone(t);S.todos=S.todos.filter(x=>x.id!==id);closeSheet();render();await remove("todos/"+id);
  toast("To-do deleted",async()=>{S.todos.push(keep);render();await save("todos/"+id,todoDoc(keep));});}
async function saveCats(list){S.catsDoc={...(S.catsDoc||{}),list:clone(list)};render();await save("meta/categories",{list});}
function tileSheet(id){const c=catOf(id);if(!c)return;S.sheet={kind:"tile",id,draft:clone(c),sure:false};drawSheet();}
function newTile(){const used=new Set(cats().map(c=>c.color)),color=Object.keys(COLORS).find(k=>!used.has(k))||"pink";
  let n=cats().length+1;while(cats().some(c=>c.name==="Category "+n))n++;
  S.sheet={kind:"tile",isNew:true,draft:{id:"c"+newId(),name:"Category "+n,emoji:EMOJIS[(n+5)%EMOJIS.length],color},sure:false};drawSheet();}
async function tileSave(){const s=S.sheet;if(!s)return;const d=s.draft;d.name=(d.name||"").trim()||"Untitled";d.emoji=(d.emoji||"").trim()||"⭐";
  const list=cats().map(c=>({...c}));if(s.isNew)list.push(d);else{const k=list.findIndex(c=>c.id===d.id);if(k>=0)list[k]=d;}
  closeSheet();await saveCats(list);toast(s.isNew?"Tile added":"Tile saved");}
async function tileDel(){const s=S.sheet;if(!s)return;if(!s.sure){s.sure=true;drawSheet();return;}
  const list=cats().filter(c=>c.id!==s.id),to=list[0];if(!to)return;const moved=S.ideas.filter(i=>i.cat===s.id);
  closeSheet();await saveCats(list);for(const i of moved){i.cat=to.id;await save("ideas/"+i.id,ideaDoc(i));}
  if(S.page==="cat"&&S.cat===s.id)go("home");toast("Tile deleted");}
async function tileMove(dir){const s=S.sheet;if(!s)return;const list=cats().map(c=>({...c})),k=list.findIndex(c=>c.id===s.id),j=k+dir;if(k<0||j<0||j>=list.length)return;
  [list[k],list[j]]=[list[j],list[k]];await saveCats(list);}

/* ---------- taps ---------- */
document.addEventListener("click",async e=>{
  if(S.page==="insights"&&!S.sheet&&IG.onClick(e))return;
  const b=e.target.closest("button");
  if(b){if(b.id==="closeS"){closeSheet();return;}if(DR.onClick(b)||UC.onClick(b)||LF.onClick(b))return;}
  const t=e.target.closest("[data-go],[data-act],[data-saveto],[data-todo],[data-idea],[data-sp],[data-spst],[data-ideadone],[data-movecat],[data-linkdel],[data-emoji],[data-color],[data-move]");if(!t)return;
  const d=t.dataset;
  if(d.go){go(d.go);return;}
  if(d.saveto){S.saveTo=d.saveto;render();const i=$("#capIn");if(i&&i.value)i.focus();return;}
  if(d.todo){tickTodo(d.todo);return;}
  if(d.sp){showSheet("sponsor",d.sp);return;}
  if(d.spst&&S.sheet){const id=S.sheet.id;await spSave(id,{status:d.spst,statusBy:"me",statusAt:Date.now()});drawSheet();toast(d.spst==="replied"?"Marked replied":d.spst==="skipped"?"Skipped":"Back on your list");return;}
  if(d.idea){showSheet("idea",d.idea);return;}
  if(d.ideadone){toggleIdea(d.ideadone);return;}
  if(d.movecat&&S.sheet){const id=S.sheet.id;await patchIdea(id,{cat:d.movecat});const c=catOf(d.movecat);toast("Moved to "+(c?c.name:"tile"));return;}
  if(d.linkdel!=null&&S.sheet){const i=S.ideas.find(x=>x.id===S.sheet.id);if(i){const links=(i.links||[]).slice();links.splice(+d.linkdel,1);await patchIdea(i.id,{links});drawSheet();}return;}
  if(d.emoji&&S.sheet&&S.sheet.kind==="tile"){S.sheet.draft.emoji=d.emoji;drawSheet();return;}
  if(d.color&&S.sheet&&S.sheet.kind==="tile"){S.sheet.draft.color=d.color;drawSheet();return;}
  if(d.move&&S.sheet){await tileMove(+d.move);drawSheet();return;}
  switch(d.act){
    case"close":closeSheet();return;
    case"settings":showSheet("settings");return;
    case"editTiles":S.editTiles=!S.editTiles;render();return;
    case"tileEdit":tileSheet(d.id);return;
    case"tileNew":newTile();return;
    case"tileSave":tileSave();return;
    case"tileDel":tileDel();return;
    case"spOld":S.spOld=!S.spOld;render();return;
    case"spCopy":{const t=$("#spDraft");if(t){try{await navigator.clipboard.writeText(t.value);toast("Reply copied");}catch(err){t.select();toast("Select all and copy");}}return;}
    case"ideaDone":S.doneOpen=!S.doneOpen;render();return;
    case"ideaToggle":if(S.sheet){await toggleIdea(S.sheet.id);drawSheet();}return;
    case"ideaDel":if(S.sheet){if(!S.sheet.sure){S.sheet.sure=true;drawSheet();return;}delIdea(S.sheet.id);}return;
    case"signout":try{const a=await window.claude.use("app");if(a)await a.signOut();}catch(err){}return;
  }
});
document.addEventListener("submit",async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="capForm"){const i=$("#capIn"),v=i.value;if(!v.trim())return;const to=catOf(S.saveTo)||cats()[0];i.value="";const id=await addIdea(v,to.id);
    toast("Saved to "+to.name,()=>{go("cat:"+to.id);setTimeout(()=>{const el=document.querySelector(`[data-ideaid="${id}"]`);if(el)el.classList.add("flash");},60);},"Open");}
  else if(f.id==="todoForm"){await LF.add();const i=$("#todoIn");if(i)i.focus();}
  else if(f.id==="ideaForm"){const i=$("#ideaIn"),v=i.value;i.value="";await addIdea(v,S.cat);$("#ideaIn")&&$("#ideaIn").focus();}
  else if(f.id==="linkForm"&&S.sheet){let u=$("#linkIn").value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u="https://"+u;const i=S.ideas.find(x=>x.id===S.sheet.id);if(i){await patchIdea(i.id,{links:[...(i.links||[]),u]});drawSheet();}}
});
// typing in a sheet saves when you leave the box
document.addEventListener("change",async e=>{
  const t=e.target,s=S.sheet;if(!s)return;
  if(t.id==="idTitle"){const v=t.value.trim();if(v)await patchIdea(s.id,{title:v});}
  else if(t.id==="idDetails")await patchIdea(s.id,{details:t.value});
  else if(t.id==="spDraft"&&s.kind==="sponsor"){const x=S.sponsors.find(y=>y.id===s.id);if(x)await spSave(x.id,{draft:{...(x.draft||{}),body:t.value,edited:true}});}
  else if(t.id==="appName"){const v=t.value.trim();S.app={...S.app,name:v};render();await save("meta/app",{...S.app,name:v});}
});
document.addEventListener("input",e=>{const t=e.target,s=S.sheet;if(!s||s.kind!=="tile")return;
  if(t.id==="tlName"){s.draft.name=t.value;const p=$(".preview .nm");if(p)p.textContent=t.value||"Name";}
  if(t.id==="tlEmoji"){const v=t.value.trim();if(v){s.draft.emoji=Array.from(v).slice(0,4).join("");const p=$(".preview .em");if(p)p.textContent=s.draft.emoji;}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet)closeSheet();});

/* ---------- start ---------- */
// home-screen app with a solid status bar: Insights sits right under it, like Instagram's own header
(()=>{const sa=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);if(!sa)return;
  const t=document.createElement("div");t.style.cssText="position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none";document.body.appendChild(t);
  const f=()=>document.documentElement.classList.toggle("pwa-opaque",t.getBoundingClientRect().height<1);f();addEventListener("resize",f);})();
readHash();render();
setInterval(()=>{if(S.page==="insights")SYNC.paint();},30000);
// a photo link arrived (Instagram covers, profile picture): draw again
addEventListener("app-blobs",()=>{if(S.page==="insights"&&IG.mounted())IG.setPosts(IG.D.postsDoc);else render();});
(async()=>{
  const {db,mode}=await openDB();S.db=db;S.mode=mode;
  const mark=k=>{S.loaded[k]=true;};
  const ideasMap=snap=>snap.docs.map(d=>({id:d.id,...clone(d.data())})).filter(x=>x&&x.title!==undefined);
  db.doc("meta/app").onSnapshot(s=>{S.app=s.exists?clone(s.data()):{};mark("app");render();},()=>mark("app"));
  db.doc("meta/categories").onSnapshot(s=>{S.catsDoc=s.exists?clone(s.data()):null;mark("cats");render();sheetSync();},()=>mark("cats"));
  db.collection("ideas").onSnapshot(s=>{S.ideas=ideasMap(s);mark("ideas");if(S.page!=="insights")render();else IG.refresh();sheetSync();},()=>{mark("ideas");render();});
  db.collection("todos").onSnapshot(s=>{S.todos=s.docs.map(d=>({id:d.id,...clone(d.data())})).filter(x=>x&&x.t!==undefined&&!x.deletedAt);mark("todos");LF.autoSort();if(S.page!=="insights")render();LF.sheetSync();},()=>{mark("todos");render();});
  db.doc("meta/todo-groups").onSnapshot(s=>{S.todoGroups=s.exists?clone(s.data()):{};S.metaReady.todoGroups=true;LF.autoSort();if(S.page!=="insights")render();LF.sheetSync();},()=>{S.metaReady.todoGroups=true;});
  db.collection("sponsors").onSnapshot(s=>{S.sponsors=s.docs.map(d=>({id:d.id,...clone(d.data())})).filter(x=>x&&!x.deletedAt);mark("sponsors");if(S.page!=="insights")render();if(S.sheet&&S.sheet.kind==="sponsor")sheetSync();},()=>{mark("sponsors");render();});
  db.doc("insights/ig_account").onSnapshot(s=>{IG.setAccount(s.exists?clone(s.data()):null);if(S.page==="home")render();},()=>{});
  db.doc("insights/ig_posts").onSnapshot(s=>{IG.setPosts(s.exists?clone(s.data()):null);if(S.page==="home")render();},()=>{});
  db.doc("insights/sync").onSnapshot(s=>{S.sync=s.exists?clone(s.data()):null;mark("sync");SYNC.paint();if(S.sheet&&S.sheet.kind==="settings")sheetSync();},()=>mark("sync"));
})();
</script>

</body>
